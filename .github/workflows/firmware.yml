name: Build and package POS
on:
  push:
    branches: [main]
    paths-ignore: ['updates/releases/**', 'updates/manifest.json', 'updates/latest.json']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      IDF_PIP_WHEELS_URL: ''
    defaults:
      run:
        working-directory: POS
    steps:
      - uses: actions/checkout@v4
        with:
          path: POS
      - name: Configure ESP-IDF tool directory
        run: printf 'IDF_TOOLS_PATH=%s/espressif\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: b774170ff46c393eeb5e495ea37936038d3f4f4f
          submodules: recursive
          path: esp-idf
      - name: Install native dependencies and pinned ESP-IDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev openssl libffi-dev python3-venv cmake ninja-build
          cd ../esp-idf
          ./install.sh esp32s3
          python3 tools/idf_tools.py install cmake ninja
      - name: Read version and check release tag
        id: version
        run: |
          pos_version=$(python3 -c 'import pathlib,re; print(re.search(r"set\(PROJECT_VER \"([0-9][A-Za-z0-9._-]{0,30})\"\)",pathlib.Path("CMakeLists.txt").read_text())[1])')
          printf 'version=%s\n' "$pos_version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$pos_version"
          fi
      - name: Build both firmware roles and run host tests
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"
          python tools/posctl.py build
          python -m unittest discover -s tests -v
      - name: Export matching USB and SD installation bundle
        env:
          POS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"
          python tools/posctl.py bundle --output dist/bundle --zip-output "dist/pos-${POS_VERSION}.zip"
          cp dist/bundle/pos-setup dist/pos-setup
          cp dist/bundle/pos-setup.sha256 dist/pos-setup.sha256
          python tools/posctl.py preview --output dist/launcher.png
          python tools/posctl.py preview --screen picker --output dist/color-picker.png
          python tools/posctl.py preview --screen boot --output dist/boot-splash.png
          python tools/posctl.py preview --screen boot --animate --output dist/boot-animation.png
          python tools/posctl.py preview --screen recorder --output dist/recorder.png
          python tools/posctl.py preview --screen files --output dist/files.png
          python tools/posctl.py preview --screen background --output dist/background.png
          python tools/posctl.py preview --screen counter --output dist/counter.png
          python tools/posctl.py preview --screen maps --output dist/maps.png
          python tools/posctl.py preview --screen world --output dist/world.png
          python tools/posctl.py preview --screen ui --animate --output dist/ui-animation.png
      - uses: actions/upload-artifact@v4
        with:
          name: pos-firmware-${{ steps.version.outputs.version }}
          path: |
            POS/dist/*.zip
            POS/dist/*.zip.sha256
            POS/dist/*.png
            POS/dist/pos-setup
            POS/dist/pos-setup.sha256
          compression-level: 0
          if-no-files-found: error
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pos-firmware-${{ needs.build.outputs.version }}
          path: firmware-downloads
      - name: Publish tested tag as an experimental prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POS_TAG: ${{ github.ref_name }}
          POS_VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Preserve already published binaries when a workflow is rerun or a
          # locally verified package has been published for this tag.
          if release_draft=$(gh release view "$POS_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$release_draft" = false ]; then
              echo "Release $POS_TAG already exists; keeping its published assets."
              exit 0
            fi
            gh release upload "$POS_TAG" firmware-downloads/*.zip firmware-downloads/*.sha256 firmware-downloads/*.png firmware-downloads/pos-setup --clobber
            gh release edit "$POS_TAG" --draft=false --prerelease --latest=false --title "POS ${POS_VERSION}" --notes-file docs/RELEASE.md
          else
            gh release create "$POS_TAG" firmware-downloads/*.zip firmware-downloads/*.sha256 firmware-downloads/*.png firmware-downloads/pos-setup --verify-tag --prerelease --latest=false --title "POS ${POS_VERSION}" --notes-file docs/RELEASE.md
          fi
